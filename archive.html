<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="_Yes1msy">
<meta name="description" content="接触イベントのレポをまとめる">
<title>repolog</title>
<link href="style.css" rel="stylesheet">
</head>
<body>

<!-- 1. ヘッダー&ナビゲーション（共通） -->
<header>
<h1>非日常的接触空間における言動の再現と検証</h1>
</header>
<div class="content">
<nav>
<ul>
<li><a href="index.html">序論/TOP</a></li>
<li><a href="record.html">実験結果/NEW RECORD</a></li>
<li><a href="archive.html">先行研究/ARCHIVE</a></li>
</ul>
</nav>

<!-- 2. メインコンテンツエリア -->
<main>
<h2>先行研究/ARCHIVE</h2>
<p>過去に執筆したレポの保管庫です。</p>

<!-- 保存されたレポカードが並ぶ場所 -->
<div id="archive-list">
  <!-- JavaScriptでここにデータが動的に挿入されます -->
</div>

</main>
</div>

<footer>
<p>@_Yes1msy</p>
</footer>

<script>
  // ページ読み込み時に保存データを呼び出して一覧表示
  document.addEventListener('DOMContentLoaded', function() {
    const archiveList = document.getElementById('archive-list');
    const archives = JSON.parse(localStorage.getItem('repolog_archives')) || [];

    if (archives.length === 0) {
      archiveList.innerHTML = '<p style="color: #888; text-align: center; padding: 40px 0;">まだ蓄積された実験データ（アーカイブ）はありません。</p>';
      return;
    }

    archives.forEach((item, index) => {
      // 1件分のカードを作成
      const card = document.createElement('div');
      // 作成時のテーマとパターンをそのままクラスに付与してプレビュー感を再現！
      card.className = `archive-card ${item.theme} ${item.pattern}`;
      card.style.cssText = "border-radius: 12px; border: 1px solid; margin-bottom: 30px; overflow: hidden; position: relative;";

      // カードの中身（ヘッダー情報 ＋ チャットログ ＋ メモ）
      card.innerHTML = `
        <div class="preview-header-info" style="background-color: #ffffff; padding: 14px 18px; display: flex; justify-content: space-between; font-size: 0.85rem; border-bottom: 1px solid #eee;">
          <div>
            <p style="margin: 2px 0;">Event: <b>${item.event}</b></p>
            <p style="margin: 2px 0;">Place: ${item.place}</p>
          </div>
          <div>
            <p style="margin: 2px 0;">Date: ${item.date}</p>
            <p style="margin: 2px 0;">♥ : ${item.oshi}</p>
          </div>
        </div>

        <div style="padding: 0 16px;">
          ${item.chatLogs}
        </div>

        ${item.memo ? `
        <div class="preview-memo-box" style="background: rgba(255,255,255,0.92); border-radius: 10px; padding: 12px 16px; margin: 20px 16px;">
          <div class="preview-memo-title" style="font-size: 0.75rem; color: #888; margin-bottom: 4px;">MEMO</div>
          <div>${item.memo}</div>
        </div>` : ''}

        <div style="padding: 10px 16px; text-align: center;">
          <button type="button" onclick="deleteArchive(${index})" style="background-color: #1e1e1e; padding: 6px 12px; font-size: 0.75rem;">このデータを削除</button>
        </div>
      `;

      // アイコン画像が保存されている場合は復元する処理
      if (item.myIcon) {
        const myIcons = card.querySelectorAll('.my-icon-container');
        myIcons.forEach(icon => {
          icon.innerHTML = `<img src="${item.myIcon}" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover; display: block;">`;
        });
      }

      archiveList.appendChild(card);
    });
  });

  // 個別のアーカイブデータを削除する関数
  function deleteArchive(index) {
    if (confirm("この実験データを削除してもよろしいですか？")) {
      let archives = JSON.parse(localStorage.getItem('repolog_archives')) || [];
      archives.splice(index, 1); // 指定インデックスを削除
      localStorage.setItem('repolog_archives', JSON.stringify(archives));
      location.reload(); // 画面を更新して反映
    }
  }
</script>

</body>
</html>
